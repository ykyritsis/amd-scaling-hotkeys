<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">AMD Scaling Hotkeys</title>
  <desc id="desc">A Windows tray utility for switching AMD Radeon GPU scaling modes with global hotkeys.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="orange" x2="1">
      <stop stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="55%">
      <stop stop-color="#f97316" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect x="0" y="0" width="5" height="300" fill="url(#orange)"/>

  <text x="56" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#fb923c">WINDOWS TRAY UTILITY</text>
  <text x="56" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#f8fafc">AMD Scaling Hotkeys</text>
  <text x="56" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#cbd5e1">Switch Radeon scaling modes without leaving the game.</text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="56" y="200" width="48" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="220" text-anchor="middle" fill="#e6edf3">Ctrl</text>
    <text x="114" y="221" fill="#64748b">+</text>
    <rect x="130" y="200" width="40" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="150" y="220" text-anchor="middle" fill="#e6edf3">Alt</text>
    <text x="180" y="221" fill="#64748b">+</text>
    <rect x="196" y="200" width="34" height="30" rx="6" fill="#161b22" stroke="#f97316"/>
    <text x="213" y="220" text-anchor="middle" fill="#fb923c">1</text>
    <rect x="244" y="200" width="34" height="30" rx="6" fill="#161b22" stroke="#f97316"/>
    <text x="261" y="220" text-anchor="middle" fill="#fb923c">2</text>
    <rect x="292" y="200" width="34" height="30" rx="6" fill="#161b22" stroke="#f97316"/>
    <text x="309" y="220" text-anchor="middle" fill="#fb923c">3</text>
    <rect x="340" y="200" width="34" height="30" rx="6" fill="#161b22" stroke="#f97316"/>
    <text x="357" y="220" text-anchor="middle" fill="#fb923c">S</text>
    <g font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">
      <text x="213" y="252">Center</text>
      <text x="261" y="252">Stretch</text>
      <text x="309" y="252">Aspect</text>
      <text x="357" y="252">Cycle</text>
    </g>
  </g>

  <g fill="none" stroke="#30363d" stroke-width="2">
    <rect x="860" y="52" width="280" height="176" rx="12" fill="#0f141a"/>
    <path d="M960 228v18M1040 228v18M930 246h140" stroke-linecap="round"/>
  </g>
  <rect x="878" y="70" width="244" height="128" rx="5" fill="#0b1016" stroke="#1f2937"/>
  <g fill="none" stroke="#475569" stroke-width="2">
    <rect x="892" y="84" width="216" height="100" rx="3"/>
    <path d="M1000 84v100"/>
  </g>
  <g fill="#f97316" opacity=".9">
    <rect x="908" y="130" width="24" height="40" rx="3"/>
    <rect x="948" y="112" width="36" height="58" rx="3"/>
    <rect x="1014" y="122" width="24" height="48" rx="3"/>
    <rect x="1054" y="100" width="36" height="70" rx="3"/>
  </g>
  <text x="1000" y="208" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" letter-spacing="2" fill="#64748b">SCALING PREVIEW</text>

  <text x="56" y="278" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#64748b">Windows 10/11 x64</text>
  <circle cx="218" cy="273" r="2" fill="#334155"/>
  <text x="232" y="278" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#64748b">AMD ADLX</text>
  <circle cx="324" cy="273" r="2" fill="#334155"/>
  <text x="338" y="278" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#64748b">No installer</text>
  <circle cx="444" cy="273" r="2" fill="#334155"/>
  <text x="458" y="278" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#64748b">MIT</text>
</svg>
